framework:
    workflows:
        # Cycle de vie d'une note de frais (docs/modele-donnees.md).
        # Les places sont les valeurs de l'enum App\Enum\ExpenseStatus, stockée dans Expense::$status.
        # Effets des transitions (dates, décision, historique) : listeners de src/Workflow/.
        expense:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Expense
            initial_marking: draft
            places:
                - draft
                - submitted
                - approved
                - rejected
            transitions:
                submit:
                    from: [draft, rejected]
                    to: submitted
                approve:
                    from: submitted
                    to: approved
                reject:
                    from: submitted
                    to: rejected
